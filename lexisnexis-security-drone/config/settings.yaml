detection:
  face_model: "models/face_recognition_model.pkl"
  min_face_confidence: 0.75
  recognition_threshold: 0.60
  frame_width: 640
  frame_height: 480
  fps: 15

threat:
  weight_unknown_face: 0.40
  weight_motion_intensity: 0.30
  weight_restricted_zone: 0.20
  weight_time_of_day: 0.10
  alert_threshold: 0.65
  critical_threshold: 0.85
  restricted_zones:
    - [0, 0, 200, 480]      # left corridor
    - [440, 0, 640, 480]    # right corridor

api:
  host: "0.0.0.0"
  port: 8000
  alert_webhook_url: ""
  api_key: "changeme"

sensor:
  camera_index: 0
  motion_sensitivity: 0.3
  depth_enabled: false
  synthetic_mode: true

log_level: "INFO"
database_path: "data/identities.db"
